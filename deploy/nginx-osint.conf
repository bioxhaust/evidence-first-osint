# Include inside the existing HTTPS server block. The application at / is separate.
# /srv/evidence-first-osint/www/osint points at an immutable built release.
location = /osint {
    return 308 /osint/;
}

location ^~ /osint/ {
    root /srv/evidence-first-osint/www;
    index index.html;
    try_files $uri $uri/ =404;
    error_page 404 /osint/404.html;
    autoindex off;
    expires -1;
}
